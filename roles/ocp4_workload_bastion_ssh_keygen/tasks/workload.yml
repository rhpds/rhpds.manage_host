---
- name: Generate SSH key pair on bastion
  ansible.builtin.user:
    name: "{{ ocp4_workload_bastion_ssh_keygen_user }}"
    generate_ssh_key: true
    ssh_key_type: "{{ ocp4_workload_bastion_ssh_keygen_key_type }}"
    ssh_key_bits: "{{ ocp4_workload_bastion_ssh_keygen_key_bits }}"
    ssh_key_file: "{{ ocp4_workload_bastion_ssh_keygen_key_path }}"
  delegate_to: "{{ ocp4_workload_bastion_ssh_keygen_host }}"

- name: Slurp private key from bastion
  ansible.builtin.slurp:
    src: "/home/{{ ocp4_workload_bastion_ssh_keygen_user }}/{{ ocp4_workload_bastion_ssh_keygen_key_path }}"
  register: _ocp4_workload_bastion_ssh_keygen_privkey
  delegate_to: "{{ ocp4_workload_bastion_ssh_keygen_host }}"

- name: Set private key fact
  ansible.builtin.set_fact:
    "{{ ocp4_workload_bastion_ssh_keygen_privatekey_fact }}": >-
      {{ _ocp4_workload_bastion_ssh_keygen_privkey.content | b64decode }}
