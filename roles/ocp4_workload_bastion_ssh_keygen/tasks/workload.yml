---
- name: Generate SSH key pair on bastion
  ansible.builtin.user:
    name: "{{ ocp4_workload_bastion_ssh_keygen_user }}"
    generate_ssh_key: true
    ssh_key_type: "{{ ocp4_workload_bastion_ssh_keygen_key_type }}"
    ssh_key_bits: "{{ ocp4_workload_bastion_ssh_keygen_key_bits }}"
    ssh_key_file: "{{ ocp4_workload_bastion_ssh_keygen_key_path }}"
  delegate_to: "{{ ocp4_workload_bastion_ssh_keygen_host }}"

- name: Slurp private key from bastion
  ansible.builtin.slurp:
    src: "/home/{{ ocp4_workload_bastion_ssh_keygen_user }}/{{ ocp4_workload_bastion_ssh_keygen_key_path }}"
  register: _ocp4_workload_bastion_ssh_keygen_privkey
  delegate_to: "{{ ocp4_workload_bastion_ssh_keygen_host }}"

- name: Slurp public key from bastion
  ansible.builtin.slurp:
    src: "/home/{{ ocp4_workload_bastion_ssh_keygen_user }}/{{ ocp4_workload_bastion_ssh_keygen_key_path }}.pub"
  register: _ocp4_workload_bastion_ssh_keygen_pubkey
  delegate_to: "{{ ocp4_workload_bastion_ssh_keygen_host }}"

- name: Write private key to local file on runner
  ansible.builtin.copy:
    content: "{{ _ocp4_workload_bastion_ssh_keygen_privkey.content | b64decode }}"
    dest: "{{ ocp4_workload_bastion_ssh_keygen_local_key_path }}"
    mode: '0600'

- name: Set ssh_provision_key_path so extravars ssh_privatekey lookup resolves
  ansible.builtin.set_fact:
    ssh_provision_key_path: "{{ ocp4_workload_bastion_ssh_keygen_local_key_path }}"

- name: Set public key fact
  ansible.builtin.set_fact:
    "{{ ocp4_workload_bastion_ssh_keygen_publickey_fact }}": >-
      {{ _ocp4_workload_bastion_ssh_keygen_pubkey.content | b64decode }}
